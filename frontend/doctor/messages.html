    <script>
      async function fetchVideoRequests() {
        try {
          const response = await fetch("/video-requests"); // Update this endpoint as needed
          const requests = await response.json();
    
          const container = document.getElementById("video-request-container");
          container.innerHTML = ""; // Clear previous content
    
          requests.forEach((request) => {
            const card = document.createElement("div");
            card.classList.add("col-lg-6");
    
            card.innerHTML = `
  <div class="card">
    <div class="card-header">
      <h6>Patient: ${request.fullname}</h6>
    </div>
    <div class="card-body">
      <h5 class="card-title">Requested At: ${new Date(request.requestTime).toLocaleString()}</h5>
      <p><strong>Reason:</strong> ${request.reason}</p>
      <div class="gap-2 d-flex">
        <button class="btn btn-success accept-btn" data-id="${request.id}">Accept</button>
        <button class="btn btn-danger decline-btn" data-id="${request.id}">Decline</button>
      </div>
    </div>
  </div>
`;

    
            container.appendChild(card);
          });
    
          // Event delegation for Accept/Decline buttons
          container.addEventListener("click", async (event) => {
            if (event.target.classList.contains("accept-btn") || event.target.classList.contains("decline-btn")) {
              const requestId = event.target.getAttribute("data-id");
              const action = event.target.classList.contains("accept-btn") ? "accept" : "decline";
    
              try {
                const res = await fetch(`/video-requests/${action}/${requestId}`, {
                  method: "POST",
                });
                if (res.ok) {
                  alert(`Request ${action}ed successfully.`);
                  fetchVideoRequests(); // Refresh
                } else {
                  alert("Failed to process the request.");
                }
              } catch (error) {
                console.error("Error processing request:", error);
              }
            }
          });
        } catch (error) {
          console.error("Failed to fetch video requests:", error);
        }
      }
    
      window.onload = fetchVideoRequests;
    </script>
